[project]
name = "ridgeline-cs-copilot"
version = "0.6.0"
description = "Ridgeline Supply Co. customer service copilot container (fictional company, synthetic data)"
requires-python = ">=3.11"
# Top-level pins. The image installs the full hashed closure from requirements.lock
# (regenerate with ./lock-deps.sh copilot after changing anything here). agent-core itself is stdlib-only.
dependencies = [
    "mcp==2.3.0",  # official MCP Python SDK: the client side of the gateway (mcp_client.py); same pin as the gateway
    "httpx2==2.16.0",  # the HTTP client the SDK's streamable HTTP transport takes (Authorization, x-request-id)
    "asyncpg==0.32.0",  # Postgres driver for pgvector long-term memory (memory.py)
]
