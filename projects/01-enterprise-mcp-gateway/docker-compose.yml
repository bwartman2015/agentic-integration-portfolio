# Project 01: Ridgeline enterprise MCP gateway + Keycloak + OPA + Postgres/pgvector (audit, memory)
# + n8n (approvals) + mock carrier and AR APIs, and the CS copilot that calls the gateway.
#   make up P=01             create/backfill .env (random secrets), build, start, wait until healthy
#   make gateway-test P=01   build the images' test stages and run the gateway and mock-API tests
#   make live-check P=01     call all four tools through MCP as cs-rep (real Keycloak token)
#   make token P=01 CLIENT=cs-rep   print a 5-minute access token (e.g. for MCP Inspector)
#   make audit P=01          the audit report (every call, allowed or denied, with its reason)
#   make approvals P=01      write requests waiting for a human, with their approval links
#   make ask P=01 Q="..."    ask the copilot (container, profile "copilot"): tools through the gateway,
#                            long-term memory in pgvector, embeddings from llama.cpp
#   make down P=01           stop
# Each container gets only the variables it needs (no env_file): Salesforce/SAP secrets reach the gateway
# only, and each mock API only its own shared secret. The mock APIs sit on an internal-only network (no
# route to the host or the internet); the gateway joins it plus the edge network that publishes its port.
# Images are local builds only (pull_policy), never pulled from a registry under these names; Keycloak is
# pinned by digest. Agent client secrets reach Keycloak (to register the clients) and the one-off `ops`
# container only, never the gateway, which needs only Keycloak's public signing keys.
# OPA (Milestone 4) sits on its own internal network that only the gateway joins, serves the read-only
# policy/ directory, and its API answers nothing but the two decision queries (policy/system_authz.rego).
# Audit and approvals (Milestone 5): Postgres holds the audit log on an internal network (`data`); the
# gateway's database role can add and read audit rows but not change or delete them.
# Copilot (Milestone 6): the same Postgres, with pgvector, holds the copilot's long-term memory in its own
# schema; the copilot's role can only add and read memory rows. The copilot reaches the gateway and
# Keycloak on `edge`, Postgres on `data` and the embedding server on `embeddings` (internal, the two of
# them only). It holds the cs-rep and cs-lead client secrets, like `ops`; never the gateway's.
# n8n runs the human-approval workflow (n8n/ridgeline-approval.json, imported at every start) and is
# published on loopback so a person can open the approval form.
name: ridgeline-p01

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: runtime
    image: ridgeline/mcp-gateway:0.5.0
    pull_policy: build
    networks: [edge, backend, policy, data, approvals]
    ports:
      # Published on loopback only (no TLS in this local stack).
      - "127.0.0.1:${GATEWAY_PORT:-8765}:8000"
    environment:
      # gateway:* lets containers on the project network (ops tools; n8n and the copilot later) call it.
      GATEWAY_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,gateway:*"
      GATEWAY_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
      # Identity (Milestone 3): tokens carry iss = the public Keycloak URL; keys are fetched internally.
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/ridgeline
      OIDC_JWKS_URL: http://keycloak:8080/realms/ridgeline/protocol/openid-connect/certs
      OIDC_AUDIENCE: ridgeline-gateway
      GATEWAY_PUBLIC_URL: http://localhost:${GATEWAY_PORT:-8765}/mcp
      # Authorization (Milestone 4): every call is decided by OPA; no answer in time means deny.
      OPA_URL: http://opa:8181
      OPA_TIMEOUT_S: "2"
      # Audit (Milestone 5): every call is recorded; a read that cannot be recorded is not returned.
      AUDIT_DB_HOST: db
      AUDIT_DB_NAME: ridgeline
      AUDIT_DB_USER: gateway_audit
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?run make up P=01 to generate .env}
      # Empty: the local `db` service. Set in .env to a hosted Postgres URL (e.g. Neon, sslmode=require)
      # to keep the audit log there instead; see docs/live-sandbox-setup.md. Never commit that URL.
      DATABASE_URL: ${DATABASE_URL:-}
      # Approvals (Milestone 5): write tools wait for a human decision in n8n; no decision in time = deny.
      N8N_APPROVAL_URL: http://n8n:5678/webhook/ridgeline-approval
      N8N_FORM_BASE_URL: http://localhost:${N8N_PORT:-5678}
      APPROVAL_TIMEOUT_S: ${APPROVAL_TIMEOUT_S:-120}
      APPROVAL_OPERATOR_TOKEN: ${APPROVAL_OPERATOR_TOKEN:?run make up P=01 to generate .env}
      # Shared secret the gateway sends to n8n's webhook (n8n refuses requests without it).
      APPROVAL_WEBHOOK_SECRET: ${APPROVAL_WEBHOOK_SECRET:?run make up P=01 to generate .env}
      # Rate limits (Milestone 5): calls per minute per client; the test-only client gets a tiny budget.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_OVERRIDES: p01-rate-test=5
      CRM_BACKEND: ${CRM_BACKEND:-seed}
      ERP_BACKEND: ${ERP_BACKEND:-seed}
      CARRIER_BACKEND: ${CARRIER_BACKEND:-http}
      AR_BACKEND: ${AR_BACKEND:-http}
      SF_LOGIN_URL: ${SF_LOGIN_URL:-}
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_API_VERSION: ${SF_API_VERSION:-v62.0}
      SAP_API_KEY: ${SAP_API_KEY:-}
      SAP_BASE_URL: ${SAP_BASE_URL:-https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_SALES_ORDER_SRV}
      CARRIER_API_URL: http://carrier-api:8001
      CARRIER_API_KEY: ${CARRIER_API_KEY:?run make up P=01 to generate .env}
      AR_API_URL: http://ar-api:8002
      AR_API_TOKEN: ${AR_API_TOKEN:?run make up P=01 to generate .env}
    depends_on:
      carrier-api:
        condition: service_healthy
      ar-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
      db:
        condition: service_healthy
      n8n:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Local dev stack: nothing restarts on its own after a reboot.
    restart: "no"

  db:
    # PostgreSQL 17 with pgvector, pinned by digest: the gateway's audit log and approval records (schema
    # public, db/audit.sql) and the copilot's long-term memory (schema memory, db/memory.sql). Internal
    # network only; not published to the host. db/init.sh creates both least-privilege roles and applies
    # both files the first time the volume is created.
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    user: postgres
    networks: [data]
    mem_limit: 256m                  # plenty for the audit log and memory; keeps Docker Desktop's VM headroom
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ridgeline
      POSTGRES_PASSWORD: ${AUDIT_DB_ADMIN_PASSWORD:?run make up P=01 to generate .env}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?run make up P=01 to generate .env}
      COPILOT_MEMORY_DB_PASSWORD: ${COPILOT_MEMORY_DB_PASSWORD:?run make up P=01 to generate .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-db.sh:ro
      - ./db/audit.sql:/db/audit.sql:ro
      - ./db/memory.sql:/db/memory.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ridgeline"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db-init:
    # One-off (`make db-init P=01`; `make db-roles P=01` runs its SQL in this container too): applies
    # db/audit.sql and db/memory.sql to a hosted database (Neon). Uses DATABASE_ADMIN_URL, else
    # DATABASE_URL_UNPOOLED (Neon's direct URL), else DATABASE_URL. Only this container ever sees the
    # admin URL; the gateway and the copilot do not. Not started by `make up` (profile "admin"). The local
    # `db` applies the same files on its own.
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    profiles: ["admin"]
    user: postgres
    networks: [edge]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        url="$${DATABASE_ADMIN_URL:-$${DATABASE_URL_UNPOOLED:-$$DATABASE_URL}}";
        [ -n "$$url" ] || { echo "set DATABASE_ADMIN_URL (or DATABASE_URL) in .env first" >&2; exit 2; };
        psql "$$url" -v ON_ERROR_STOP=1 --quiet -f /db/audit.sql -f /db/memory.sql &&
        echo "audit and memory schemas are in place"
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}   # direct connection, preferred for schema changes
      DATABASE_URL: ${DATABASE_URL:-}
      PSQL_HISTORY: /dev/null
    volumes:
      - ./db/audit.sql:/db/audit.sql:ro
      - ./db/memory.sql:/db/memory.sql:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  n8n:
    # n8n 2.47.3 (Community Edition), pinned by digest: the human-approval workflow for write tools.
    # At every start: the webhook's shared-secret credential is loaded from APPROVAL_WEBHOOK_SECRET (n8n
    # stores it encrypted; the temporary file lives in tmpfs and is removed), then the committed workflow
    # n8n/ridgeline-approval.json is imported and published, so the running workflow is always that file.
    # Networks: `approvals` (internal) is shared with the gateway only, so no agent container can reach
    # n8n or its execution data; `n8n-public` exists only to publish the form on 127.0.0.1 for a person.
    image: n8nio/n8n:2.47.3@sha256:6723b440354bb8e1395a1ecee12685fe03923f897bf6e4d5bb2c6c2bd2051697
    entrypoint: ["sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf '[{"id":"RidgelineApprHdr1","name":"Gateway approval header","type":"httpHeaderAuth","data":{"name":"X-Ridgeline-Approval","value":"%s"}}]' "$$APPROVAL_WEBHOOK_SECRET" > /tmp/approval-credential.json &&
        n8n import:credentials --input=/tmp/approval-credential.json &&
        rm -f /tmp/approval-credential.json &&
        n8n import:workflow --input=/workflows/ridgeline-approval.json &&
        n8n publish:workflow --id=RidgelineApprove1 &&
        exec n8n start
    networks: [approvals, n8n-public]
    mem_limit: 768m
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      # Links in approval forms use this public address.
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run make up P=01 to generate .env}
      N8N_SECURE_COOKIE: "false"                 # the editor is served over plain http on loopback
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"       # workflows cannot read this container's environment
      N8N_DIAGNOSTICS_ENABLED: "false"           # no telemetry
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"            # no API-key access to workflows or execution data
      EXECUTIONS_DATA_PRUNE: "true"              # finished executions (they hold case text) are deleted
      EXECUTIONS_DATA_MAX_AGE: "168"             # after 7 days
      APPROVAL_WEBHOOK_SECRET: ${APPROVAL_WEBHOOK_SECRET:?run make up P=01 to generate .env}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 5s
      retries: 90            # a cold start next to the other services can take several minutes on a laptop
      start_period: 30s
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  carrier-api:
    build:
      context: .
      dockerfile: mock_apis/Dockerfile
      target: runtime
    image: ridgeline/mock-apis:0.1.0
    pull_policy: build
    networks: [backend]
    environment:
      APP: carrier
      PORT: "8001"
      CARRIER_API_KEY: ${CARRIER_API_KEY:?run make up P=01 to generate .env}
    expose:
      - "8001"           # internal network only; not published to the host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  ar-api:
    image: ridgeline/mock-apis:0.1.0
    pull_policy: never               # same local image that carrier-api builds; never pulled
    networks: [backend]
    depends_on:
      carrier-api:
        condition: service_started   # same image; carrier-api builds it
    environment:
      APP: ar
      PORT: "8002"
      AR_API_TOKEN: ${AR_API_TOKEN:?run make up P=01 to generate .env}
    expose:
      - "8002"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  keycloak:
    # Keycloak 26.8.2, pinned by digest. Dev mode (no TLS, H2 database) on loopback only; the realm is
    # re-imported from keycloak/ridgeline-realm.json with secrets substituted from the environment.
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    networks: [edge]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run make up P=01 to generate .env}
      # Fixed public issuer for every token; internal callers (the gateway's key fetch) use keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      CS_REP_CLIENT_SECRET: ${CS_REP_CLIENT_SECRET:?run make up P=01 to generate .env}
      CS_LEAD_CLIENT_SECRET: ${CS_LEAD_CLIENT_SECRET:?run make up P=01 to generate .env}
      P01_EXPIRY_TEST_CLIENT_SECRET: ${P01_EXPIRY_TEST_CLIENT_SECRET:?run make up P=01 to generate .env}
      P01_CRM_ONLY_TEST_CLIENT_SECRET: ${P01_CRM_ONLY_TEST_CLIENT_SECRET:?run make up P=01 to generate .env}
      P01_RATE_TEST_CLIENT_SECRET: ${P01_RATE_TEST_CLIENT_SECRET:?run make up P=01 to generate .env}
      P01_AUDITOR_CLIENT_SECRET: ${P01_AUDITOR_CLIENT_SECRET:?run make up P=01 to generate .env}
    volumes:
      - ./keycloak/ridgeline-realm.json:/opt/keycloak/data/import/ridgeline-realm.json:ro
    # Ephemeral database: every (re)start imports the committed realm exactly, with the current .env
    # secrets. Nothing in this realm is meant to be edited by hand and kept.
    tmpfs:
      - /opt/keycloak/data/h2:uid=1000,gid=0,mode=0770
    healthcheck:
      # The image has no curl: talk HTTP to the management port with bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 90            # a cold start next to the other services can take several minutes on a laptop
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  opa:
    # Open Policy Agent 1.22.2 (static build: one binary, no shell), pinned by digest. The policy decision
    # point for the gateway: default deny, per-tool scopes and the region data rule (policy/gateway.rego).
    image: openpolicyagent/opa:1.22.2-static@sha256:f4e9be2903cd1377619366957446525fd8235a37dae4aae833224f0f6b017094
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --authorization=basic        # policy/system_authz.rego: only the decision queries and /health
      - --log-level=error            # no request logs; decision logging stays off (inputs hold arguments)
      - /policy/gateway.rego
      - /policy/system_authz.rego
      - /policy/data.json
    networks: [policy]               # internal; shared with the gateway only, not published to the host
    expose:
      - "8181"
    volumes:
      - ./policy:/policy:ro
    healthcheck:
      # No shell or HTTP client in the image: the check evaluates the mounted policy with the same binary,
      # so a policy that does not compile is unhealthy and the gateway does not start against it. Whether
      # the server answers is enforced per call: the gateway denies when OPA does not respond.
      test: ["CMD", "/opa", "eval", "--fail", "-d", "/policy/gateway.rego", "-d", "/policy/system_authz.rego", "-d", "/policy/data.json", "data.ridgeline.gateway.allowed_tools"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  ops:
    # One-off operator tools (make live-check, token, audit, approvals, request-case): same image as the
    # gateway, holds the agent client secrets so the gateway container never does. Not started by
    # `make up` (profile "ops").
    image: ridgeline/mcp-gateway:0.5.0
    pull_policy: never
    profiles: ["ops"]
    networks: [edge]
    environment:
      OIDC_TOKEN_URL: http://keycloak:8080/realms/ridgeline/protocol/openid-connect/token
      CS_REP_CLIENT_SECRET: ${CS_REP_CLIENT_SECRET:?run make up P=01 to generate .env}
      CS_LEAD_CLIENT_SECRET: ${CS_LEAD_CLIENT_SECRET:?run make up P=01 to generate .env}
      LIVE_CHECK_URL: http://gateway:8000/mcp
      GATEWAY_BASE_URL: http://gateway:8000
      P01_AUDITOR_CLIENT_SECRET: ${P01_AUDITOR_CLIENT_SECRET:?run make up P=01 to generate .env}
      APPROVAL_OPERATOR_TOKEN: ${APPROVAL_OPERATOR_TOKEN:?run make up P=01 to generate .env}
      APPROVAL_TIMEOUT_S: ${APPROVAL_TIMEOUT_S:-120}
      CRM_BACKEND: ${CRM_BACKEND:-seed}
      ERP_BACKEND: ${ERP_BACKEND:-seed}
      CARRIER_BACKEND: ${CARRIER_BACKEND:-http}
      AR_BACKEND: ${AR_BACKEND:-http}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  copilot:
    # The CS copilot (Milestone 6), one question per run: `make ask P=01 Q="..." [ROLE=cs-lead]`. Tools and
    # state through the gateway's MCP endpoint with the role's Keycloak token; long-term memory in the
    # `memory` schema (MEMORY_DATABASE_URL when set, e.g. Neon; else the local `db`); embeddings from the
    # `embeddings` service. Not started by `make up` (profile "copilot").
    build:
      context: .
      dockerfile: copilot/Dockerfile
      target: runtime
      additional_contexts:
        agentcore: ../../agent-core
    image: ridgeline/cs-copilot:0.6.0
    pull_policy: never               # local build only: `make ask` and `make models` build it first
    profiles: ["copilot"]
    networks: [edge, data, embeddings]
    environment:
      GATEWAY_URL: http://gateway:8000/mcp
      OIDC_TOKEN_URL: http://keycloak:8080/realms/ridgeline/protocol/openid-connect/token
      CS_REP_CLIENT_SECRET: ${CS_REP_CLIENT_SECRET:?run make up P=01 to generate .env}
      CS_LEAD_CLIENT_SECRET: ${CS_LEAD_CLIENT_SECRET:?run make up P=01 to generate .env}
      APPROVAL_TIMEOUT_S: ${APPROVAL_TIMEOUT_S:-120}
      # The model: scripted plans until Milestone 7 chooses a local chat model.
      LLM_PROVIDER: ${COPILOT_LLM_PROVIDER:-scripted}
      MEMORY_BACKEND: pgvector
      MEMORY_DATABASE_URL: ${MEMORY_DATABASE_URL:-}
      MEMORY_DB_HOST: db
      MEMORY_DB_NAME: ridgeline
      COPILOT_MEMORY_DB_PASSWORD: ${COPILOT_MEMORY_DB_PASSWORD:?run make up P=01 to generate .env}
      EMBEDDINGS_URL: http://embeddings:8080
    depends_on:
      embeddings:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  embeddings:
    # llama.cpp server b12282 (CPU), pinned by digest: OpenAI-compatible /v1/embeddings for
    # nomic-embed-text-v1.5 (768 dimensions) from the `models` volume (`make models P=01` fills it,
    # checksum-verified). Internal network shared with the copilot only; no internet, not published.
    image: ghcr.io/ggml-org/llama.cpp:server-b12282@sha256:086942d6ac097c894d9d5bbaf8085c53af85e113fbb9d6d61b3748863c86aa5f
    profiles: ["copilot"]
    command: ["-m", "/models/nomic-embed-text-v1.5.Q8_0.gguf", "--embedding", "--pooling", "mean",
              "-c", "2048", "-b", "2048", "-ub", "2048", "--threads", "2", "--host", "0.0.0.0", "--port", "8080"]
    networks: [embeddings]
    mem_limit: 512m
    expose:
      - "8080"
    volumes:
      - models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  models:
    # One-off (`make models P=01`): downloads the embedding model into the `models` volume and verifies
    # its SHA-256 (copilot/fetch_model.py). Same image as the copilot. Profile "admin".
    image: ridgeline/cs-copilot:0.6.0
    pull_policy: never
    profiles: ["admin"]
    entrypoint: ["python", "copilot/fetch_model.py"]
    networks: [edge]
    volumes:
      - models:/models
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  edge: {}
  backend:
    internal: true
  policy:
    internal: true
  data:
    internal: true    # Postgres: the gateway (audit) and the copilot (memory)
  embeddings:
    internal: true    # copilot <-> embedding server only
  approvals:
    internal: true    # gateway <-> n8n only (approval requests and callbacks)
  n8n-public: {}      # publishes the approval form on 127.0.0.1; no other service joins it

volumes:
  db-data: {}         # audit log and memory survive `make down`; `docker volume rm ridgeline-p01_db-data` resets them
  models: {}          # the embedding model (make models P=01)
